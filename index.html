<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viral Video Finder</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #2d2d2d;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; color: white; margin-bottom: 36px; }
        header h1 { font-size: clamp(2rem, 3vw, 2.8rem); margin-bottom: 10px; }
        header p { opacity: 0.92; font-size: 1.05rem; }
        .search-box {
            background: white; border-radius: 16px; padding: 28px; box-shadow: 0 18px 50px rgba(0,0,0,0.18);
            margin-bottom: 28px;
        }
        .platform-selector { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
        .platform-btn {
            flex: 1; min-width: 140px; padding: 12px 18px; border-radius: 10px; border: 2px solid #e2e8f0;
            background: white; font-weight: 700; cursor: pointer; transition: .2s ease;
        }
        .platform-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2); color: white; border-color: transparent;
            box-shadow: 0 10px 24px rgba(102, 126, 234, 0.25);
        }
        .platform-btn:hover { transform: translateY(-2px); }
        .search-controls { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 18px; margin-bottom: 18px; }
        .control-group { display: flex; flex-direction: column; }
        label { font-weight: 700; margin-bottom: 8px; color: #4a5568; }
        input, select {
            width: 100%; border: 2px solid #e2e8f0; border-radius: 10px; padding: 12px 14px; font-size: 1rem;
            transition: .2s ease;
        }
        input:focus, select:focus {
            outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,.12);
        }
        .niche-suggestions { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0 22px; }
        .niche-tag {
            background: rgba(102,126,234,0.12); border: 1px solid rgba(102,126,234,0.3); color: #4c51bf;
            border-radius: 999px; padding: 8px 12px; cursor: pointer; font-size: 0.85rem; font-weight: 600;
        }
        .niche-tag:hover { background: rgba(102,126,234,0.18); }
        .button-group { display: flex; gap: 12px; }
        .btn {
            flex: 1; padding: 14px 18px; border: none; border-radius: 10px; font-weight: 800; cursor: pointer;
            text-transform: uppercase; letter-spacing: .04em; transition: .2s ease;
        }
        .btn-search {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; flex: 2.2;
            box-shadow: 0 10px 24px rgba(102,126,234,.25);
        }
        .btn-search:hover { transform: translateY(-2px); }
        .btn-clear { background: #edf2f7; color: #2d3748; }
        .btn-clear:hover { background: #e2e8f0; }
        .results-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .video-card {
            background: white; border-radius: 14px; overflow: hidden; box-shadow: 0 14px 35px rgba(0,0,0,0.12);
            display: flex; flex-direction: column; transition: .2s ease;
        }
        .video-card:hover { transform: translateY(-6px); }
        .video-thumbnail {
            position: relative; height: 170px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex; align-items: center; justify-content: center; color: white; font-size: 3rem;
        }
        .platform-badge {
            position: absolute; right: 12px; top: 12px; padding: 6px 10px; border-radius: 16px; font-size: .72rem; font-weight: 800;
            color: white; background: rgba(255,255,255,.15); backdrop-filter: blur(4px);
        }
        .platform-badge.instagram { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
        .platform-badge.youtube { background: #ff0000; }
        .video-info { padding: 16px; display: flex; flex-direction: column; height: 100%; }
        .video-title { font-size: .98rem; font-weight: 700; color: #2d3748; line-height: 1.5; margin-bottom: 12px; }
        .video-stats { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; margin-bottom: 12px; }
        .stat { display: flex; flex-direction: column; }
        .stat-label { font-size: .76rem; color: #718096; font-weight: 600; }
        .stat-value { font-size: 1.1rem; color: #4c51bf; font-weight: 800; }
        .meta { margin-top: auto; color: #718096; font-size: .82rem; margin-bottom: 14px; }
        .video-actions { display: flex; gap: 8px; }
        .action-btn {
            flex: 1; border: 1px solid #dfe3f0; background: white; color: #4c51bf; border-radius: 8px; padding: 9px 10px;
            font-weight: 700; cursor: pointer; transition: .2s ease;
        }
        .action-btn:hover { background: #f7f9ff; border-color: #b6c3ff; }
        .empty-state, .loading {
            text-align: center; color: white; padding: 60px 20px;
        }
        .empty-state-icon { font-size: 4rem; margin-bottom: 18px; }
        .spinner {
            width: 42px; height: 42px; border-radius: 50%; border: 4px solid rgba(255,255,255,.3); border-top-color: white;
            display: inline-block; animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 768px) {
            .search-controls { grid-template-columns: 1fr; }
            .button-group { flex-direction: column; }
            .results-container { grid-template-columns: 1fr; }
            .search-box { padding: 20px; }
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>🎬 Viral Video Finder</h1>
        <p>Descubra vídeos virais por nicho no Instagram e YouTube</p>
    </header>

    <div class="search-box">
        <div>
            <label style="display:block; margin-bottom:14px; font-size:1rem; font-weight:700;">Selecione as plataformas</label>
            <div class="platform-selector">
                <button class="platform-btn active" data-platform="instagram">📷 Instagram Reels</button>
                <button class="platform-btn active" data-platform="youtube">▶️ YouTube Shorts</button>
            </div>
        </div>

        <div class="search-controls">
            <div class="control-group">
                <label for="niche">Nicho / categoria</label>
                <input id="niche" type="text" placeholder="Ex: Marketing, fitness, IA..." autocomplete="off">
            </div>
            <div class="control-group">
                <label for="language">Idioma</label>
                <select id="language">
                    <option value="pt-BR">Português (Brasil)</option>
                    <option value="pt-PT">Português (Portugal)</option>
                    <option value="es">Español</option>
                    <option value="en">English</option>
                </select>
            </div>
            <div class="control-group">
                <label for="period">Período</label>
                <select id="period">
                    <option value="month">Últimos 30 dias</option>
                    <option value="quarter">Últimos 90 dias</option>
                    <option value="year">Último ano</option>
                    <option value="all">Todos os tempos</option>
                </select>
            </div>
        </div>

        <div>
            <p style="font-size: 0.9rem; color:#6b7280; margin-bottom:10px;">💡 Nichos em alta</p>
            <div class="niche-suggestions" id="nicheSuggestions">
                <span class="niche-tag">IA & Tecnologia</span>
                <span class="niche-tag">Finanças Pessoais</span>
                <span class="niche-tag">Bem-estar</span>
                <span class="niche-tag">Criação de Conteúdo</span>
                <span class="niche-tag">Empreendedorismo</span>
                <span class="niche-tag">Visual Merchandising</span>
                <span class="niche-tag">Produtividade</span>
                <span class="niche-tag">Marketing Digital</span>
            </div>
        </div>

        <div class="button-group">
            <button class="btn btn-search" id="searchBtn">🔎 Buscar vídeos virais</button>
            <button class="btn btn-clear" id="clearBtn">Limpar</button>
        </div>
    </div>

    <div id="resultsArea"></div>
</div>

<script>
    const demoVideos = {
        instagram: [
            { title: 'Dica de Marketing: como viralizar no Instagram', views: 2500000, likes: 185000, format: 'Reel', duration: '45s', videoUrl: 'https://www.instagram.com/reel/CyFGA78J8XI/' },
            { title: 'Transformação visual em 3 minutos - Merchandising na prática', views: 1800000, likes: 142000, format: 'Reel', duration: '3m', videoUrl: 'https://www.instagram.com/reel/CEjtoFQgmmD/' },
            { title: '5 truques de IA que vão revolucionar seu negócio', views: 3200000, likes: 256000, format: 'Reel', duration: '60s', videoUrl: 'https://www.instagram.com/reel/CwOAwQhLpPo/' },
            { title: 'Produtividade: organize sua vida em 1 semana', views: 1600000, likes: 128000, format: 'Reel', duration: '2m', videoUrl: 'https://www.instagram.com/reel/Cz8c8J0vVsy/' },
            { title: 'Finanças pessoais: comece a investir com R$100', views: 2100000, likes: 168000, format: 'Reel', duration: '90s', videoUrl: 'https://www.instagram.com/reel/C3fYQjvRx0g/' },
            { title: 'Bem-estar: exercícios para a terceira idade', views: 890000, likes: 71200, format: 'Reel', duration: '4m', videoUrl: 'https://www.instagram.com/reel/C8kq7gDr2jD/' }
        ],
        youtube: [
            { title: 'Como encontrar conteúdo viral no seu nicho - análise completa', views: 5200000, likes: 312000, format: 'Short', duration: '45s', videoUrl: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ' },
            { title: 'Estratégia de empreendedorismo digital em 2026', views: 3800000, likes: 228000, format: 'Short', duration: '60s', videoUrl: 'https://www.youtube.com/watch?v=aqz-KE-bpKQ' },
            { title: 'IA para criadores de conteúdo: guia prático', views: 4100000, likes: 246000, format: 'Short', duration: '90s', videoUrl: 'https://www.youtube.com/watch?v=JGwWNGJdvx8' },
            { title: 'Reputação online: construa sua marca pessoal', views: 2700000, likes: 162000, format: 'Short', duration: '3m', videoUrl: 'https://www.youtube.com/watch?v=ysz5S6PUM-U' },
            { title: 'Negócios B2B: estrutura de cursos online', views: 1900000, likes: 114000, format: 'Short', duration: '5m', videoUrl: 'https://www.youtube.com/watch?v=ScMzIvxBSi4' },
            { title: 'Tendências de mercado: setores em crescimento', views: 3300000, likes: 198000, format: 'Short', duration: '2m', videoUrl: 'https://www.youtube.com/watch?v=ktvTqknDobU' }
        ]
    };

    const selectedPlatforms = new Set(['instagram', 'youtube']);

    document.querySelectorAll('.platform-btn').forEach(button => {
        button.addEventListener('click', () => {
            const platform = button.dataset.platform;
            if (selectedPlatforms.has(platform)) {
                if (selectedPlatforms.size === 1) return;
                selectedPlatforms.delete(platform);
                button.classList.remove('active');
            } else {
                selectedPlatforms.add(platform);
                button.classList.add('active');
            }
        });
    });

    document.querySelectorAll('.niche-tag').forEach(tag => {
        tag.addEventListener('click', () => {
            document.getElementById('niche').value = tag.textContent;
            performSearch();
        });
    });

    document.getElementById('searchBtn').addEventListener('click', performSearch);
    document.getElementById('clearBtn').addEventListener('click', clearFilters);
    document.getElementById('niche').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') performSearch();
    });

    function clearFilters() {
        document.getElementById('niche').value = '';
        document.getElementById('language').value = 'pt-BR';
        document.getElementById('period').value = 'month';
        document.getElementById('resultsArea').innerHTML = `
            <div class="empty-state">
                <div class="empty-state-icon">🎬</div>
                <div class="empty-state-text">Digite um nicho e clique em "Buscar vídeos virais" para começar.</div>
            </div>
        `;
    }

    function performSearch() {
        const niche = document.getElementById('niche').value.trim();
        if (!niche) {
            alert('Digite um nicho ou categoria antes de buscar.');
            return;
        }
        if (selectedPlatforms.size === 0) {
            alert('Selecione ao menos uma plataforma.');
            return;
        }

        document.getElementById('resultsArea').innerHTML = `
            <div class="loading">
                <div class="spinner"></div>
                <p style="margin-top:16px; font-size:1.05rem;">Buscando vídeos virais de "${escapeHtml(niche)}"...</p>
            </div>
        `;

        setTimeout(() => {
            renderResults(niche);
        }, 1200);
    }

    function renderResults(niche) {
        let videos = [];
        if (selectedPlatforms.has('instagram')) videos = videos.concat(demoVideos.instagram.map(v => ({ ...v, platform: 'instagram', keyword: niche })));
        if (selectedPlatforms.has('youtube')) videos = videos.concat(demoVideos.youtube.map(v => ({ ...v, platform: 'youtube', keyword: niche })));

        const language = document.getElementById('language').value;
        const period = document.getElementById('period').value;

        let html = `
            <div style="color:white; margin: 18px 0 12px; font-size:1rem; font-weight:600;">
                Resultados para: "${escapeHtml(niche)}" | Plataformas: ${[...selectedPlatforms].map(p => p === 'instagram' ? 'Instagram' : 'YouTube').join(', ')} | Idioma: ${getLanguageName(language)} | Período: ${getPeriodName(period)}
            </div>
        `;

        if (!videos.length) {
            html += `
                <div class="empty-state">
                    <div class="empty-state-icon">🔎</div>
                    <div class="empty-state-text">Nenhum vídeo encontrado para este nicho.</div>
                </div>
            `;
        } else {
            videos = videos.sort(() => Math.random() - 0.5);
            html += '<div class="results-container">';
            videos.forEach(video => {
                html += `
                    <div class="video-card">
                        <div class="video-thumbnail">
                            ${video.platform === 'instagram' ? '📷' : '▶️'}
                            <span class="platform-badge ${video.platform}">${video.platform === 'instagram' ? 'Instagram' : 'YouTube'}</span>
                        </div>
                        <div class="video-info">
                            <div class="video-title">${escapeHtml(video.title)}</div>
                            <div class="video-stats">
                                <div class="stat">
                                    <span class="stat-label">Visualizações</span>
                                    <span class="stat-value">${formatNumber(video.views)}</span>
                                </div>
                                <div class="stat">
                                    <span class="stat-label">Curtidas</span>
                                    <span class="stat-value">${formatNumber(video.likes)}</span>
                                </div>
                            </div>
                            <div class="meta">📁 ${video.format} • ⏱️ ${video.duration}</div>
                            <div class="video-actions">
                                <button class="action-btn" onclick="copyToClipboard('${escapeHtml(video.title)}')">📋 Copiar</button>
                                <button class="action-btn" onclick="window.open('${video.videoUrl}', '_blank', 'noopener,noreferrer')">🔗 Abrir</button>
                            </div>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
        }

        document.getElementById('resultsArea').innerHTML = html;
    }

    function formatNumber(value) {
        if (value >= 1000000) return (value / 1000000).toFixed(1) + 'M';
        if (value >= 1000) return (value / 1000).toFixed(0) + 'K';
        return String(value);
    }

    function getLanguageName(code) {
        const map = { 'pt-BR': 'Português (Brasil)', 'pt-PT': 'Português (Portugal)', es: 'Español', en: 'English' };
        return map[code] || code;
    }

    function getPeriodName(period) {
        const map = {
            month: 'Últimos 30 dias',
            quarter: 'Últimos 90 dias',
            year: 'Último ano',
            all: 'Todos os tempos'
        };
        return map[period] || period;
    }

    function escapeHtml(text) {
        return text
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function copyToClipboard(text) {
        const cleanText = text
            .replace(/&quot;/g, '"')
            .replace(/&#039;/g, "'")
            .replace(/&amp;/g, '&');

        navigator.clipboard.writeText(cleanText)
            .then(() => alert('✅ Título copiado para a área de transferência!'))
            .catch(() => alert('Não foi possível copiar automaticamente.'));
    }

    clearFilters();
</script>
</body>
</html>
