<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viral Video Finder</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; padding: 20px; color: #2d2d2d; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; color: white; margin-bottom: 36px; }
        header h1 { font-size: clamp(2rem, 3vw, 2.8rem); margin-bottom: 10px; }
        header p { opacity: .92; font-size: 1.05rem; }
        .search-box { background: white; border-radius: 16px; padding: 28px; box-shadow: 0 18px 50px rgba(0,0,0,.18); margin-bottom: 28px; }
        .platform-selector, .niche-suggestions, .button-group, .video-actions { display: flex; gap: 12px; flex-wrap: wrap; }
        .platform-selector { margin-bottom: 20px; }
        .platform-btn { flex: 1; min-width: 140px; padding: 12px 18px; border-radius: 10px; border: 2px solid #e2e8f0; background: white; font-weight: 700; cursor: pointer; }
        .platform-btn.active, .btn-search { background: linear-gradient(135deg, #667eea, #764ba2); color: white; border-color: transparent; }
        .search-controls { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 18px; margin: 18px 0; }
        .control-group { display: flex; flex-direction: column; }
        label { font-weight: 700; margin-bottom: 8px; color: #4a5568; }
        input, select { width: 100%; border: 2px solid #e2e8f0; border-radius: 10px; padding: 12px 14px; font-size: 1rem; }
        .niche-suggestions { margin: 12px 0 22px; }
        .niche-tag { background: rgba(102,126,234,.12); border: 1px solid rgba(102,126,234,.3); color: #4c51bf; border-radius: 999px; padding: 8px 12px; cursor: pointer; font-size: .85rem; font-weight: 600; }
        .btn { flex: 1; padding: 14px 18px; border: 0; border-radius: 10px; font-weight: 800; cursor: pointer; text-transform: uppercase; }
        .btn-clear { background: #edf2f7; color: #2d3748; }
        .results-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .video-card { background: white; border-radius: 14px; overflow: hidden; box-shadow: 0 14px 35px rgba(0,0,0,.12); display: flex; flex-direction: column; }
        .video-thumbnail { position: relative; height: 170px; background: linear-gradient(135deg, #667eea, #764ba2); display: flex; align-items: center; justify-content: center; color: white; font-size: 3rem; }
        .platform-badge { position: absolute; right: 12px; top: 12px; padding: 6px 10px; border-radius: 16px; font-size: .72rem; font-weight: 800; color: white; background: #555; }
        .platform-badge.instagram { background: #dc2743; }
        .platform-badge.youtube { background: #f00; }
        .video-info { padding: 16px; display: flex; flex-direction: column; height: 100%; }
        .video-title { font-size: .98rem; font-weight: 700; color: #2d3748; line-height: 1.5; margin-bottom: 12px; }
        .video-stats { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; margin-bottom: 12px; }
        .stat { display: flex; flex-direction: column; }
        .stat-label { font-size: .76rem; color: #718096; font-weight: 600; }
        .stat-value { font-size: 1.1rem; color: #4c51bf; font-weight: 800; }
        .meta { margin-top: auto; color: #718096; font-size: .82rem; margin-bottom: 14px; }
        .video-actions { gap: 8px; }
        .action-btn { flex: 1; border: 1px solid #dfe3f0; background: white; color: #4c51bf; border-radius: 8px; padding: 9px 10px; font-weight: 700; cursor: pointer; text-align: center; text-decoration: none; }
        .empty-state, .loading { text-align: center; color: white; padding: 60px 20px; }
        @media (max-width: 768px) { .search-controls { grid-template-columns: 1fr; } .button-group { flex-direction: column; } .results-container { grid-template-columns: 1fr; } .search-box { padding: 20px; } }
    </style>
</head>
<body>
<div class="container">
    <header><h1>🎬 Viral Video Finder</h1><p>Descubra vídeos virais por nicho no Instagram e YouTube</p></header>
    <div class="search-box">
        <label style="display:block; margin-bottom:14px">Selecione as plataformas</label>
        <div class="platform-selector">
            <button class="platform-btn active" data-platform="instagram">📷 Instagram Reels</button>
            <button class="platform-btn active" data-platform="youtube">▶️ YouTube Shorts</button>
        </div>
        <div class="search-controls">
            <div class="control-group"><label for="niche">Nicho / categoria</label><input id="niche" type="text" placeholder="Ex: Marketing, fitness, IA..." autocomplete="off"></div>
            <div class="control-group"><label for="language">Idioma</label><select id="language"><option value="pt-BR">Português (Brasil)</option><option value="pt-PT">Português (Portugal)</option><option value="es">Español</option><option value="en">English</option></select></div>
            <div class="control-group"><label for="period">Período</label><select id="period"><option value="month">Últimos 30 dias</option><option value="quarter">Últimos 90 dias</option><option value="year">Último ano</option><option value="all">Todos os tempos</option></select></div>
        </div>
        <p style="font-size:.9rem; color:#6b7280; margin-bottom:10px">💡 Nichos em alta</p>
        <div class="niche-suggestions">
            <button class="niche-tag">IA &amp; Tecnologia</button><button class="niche-tag">Finanças Pessoais</button><button class="niche-tag">Bem-estar</button><button class="niche-tag">Criação de Conteúdo</button><button class="niche-tag">Empreendedorismo</button><button class="niche-tag">Visual Merchandising</button><button class="niche-tag">Produtividade</button><button class="niche-tag">Marketing Digital</button>
        </div>
        <div class="button-group"><button class="btn btn-search" id="searchBtn">🔎 Buscar vídeos virais</button><button class="btn btn-clear" id="clearBtn">Limpar</button></div>
    </div>
    <div id="resultsArea"></div>
</div>
<script>
    const demoVideos = {
        instagram: [
            { title: 'Dica de Marketing: como viralizar no Instagram', views: 2500000, likes: 185000, format: 'Reel', duration: '45s', videoUrl: 'https://www.instagram.com/reel/CyFGA78J8XI/' },
            { title: 'Transformação visual em 3 minutos - Merchandising na prática', views: 1800000, likes: 142000, format: 'Reel', duration: '3m', videoUrl: 'https://www.instagram.com/reel/CEjtoFQgmMD/' },
            { title: '5 truques de IA que vão revolucionar seu negócio', views: 3200000, likes: 256000, format: 'Reel', duration: '60s', videoUrl: 'https://www.instagram.com/reel/CwOAwQhLpPo/' },
            { title: 'Produtividade: organize sua vida em 1 semana', views: 1600000, likes: 128000, format: 'Reel', duration: '2m', videoUrl: 'https://www.instagram.com/reel/Cz8c8J0vVsy/' },
            { title: 'Finanças pessoais: comece a investir com R$100', views: 2100000, likes: 168000, format: 'Reel', duration: '90s', videoUrl: 'https://www.instagram.com/reel/C3fYQjvRx0g/' },
            { title: 'Bem-estar: exercícios para a terceira idade', views: 890000, likes: 71200, format: 'Reel', duration: '4m', videoUrl: 'https://www.instagram.com/reel/C8kq7gDr2jD/' }
        ],
        youtube: [
            { title: 'Como encontrar conteúdo viral no seu nicho - análise completa', views: 5200000, likes: 312000, format: 'Short', duration: '45s', videoUrl: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ' },
            { title: 'Estratégia de empreendedorismo digital em 2026', views: 3800000, likes: 228000, format: 'Short', duration: '60s', videoUrl: 'https://www.youtube.com/watch?v=aqz-KE-bpKQ' },
            { title: 'IA para criadores de conteúdo: guia prático', views: 4100000, likes: 246000, format: 'Short', duration: '90s', videoUrl: 'https://www.youtube.com/watch?v=JGwWNGJdvx8' },
            { title: 'Reputação online: construa sua marca pessoal', views: 2700000, likes: 162000, format: 'Short', duration: '3m', videoUrl: 'https://www.youtube.com/watch?v=ysz5S6PUM-U' },
            { title: 'Negócios B2B: estrutura de cursos online', views: 1900000, likes: 114000, format: 'Short', duration: '5m', videoUrl: 'https://www.youtube.com/watch?v=ScMzIvxBSi4' },
            { title: 'Tendências de mercado: setores em crescimento', views: 3300000, likes: 198000, format: 'Short', duration: '2m', videoUrl: 'https://www.youtube.com/watch?v=ktvTqknDobU' }
        ]
    };
    const selectedPlatforms = new Set(['instagram', 'youtube']);
    document.querySelectorAll('.platform-btn').forEach(button => button.addEventListener('click', () => {
        const platform = button.dataset.platform;
        if (selectedPlatforms.has(platform)) {
            if (selectedPlatforms.size === 1) return;
            selectedPlatforms.delete(platform); button.classList.remove('active');
        } else { selectedPlatforms.add(platform); button.classList.add('active'); }
    }));
    document.querySelectorAll('.niche-tag').forEach(tag => tag.addEventListener('click', () => {
        document.getElementById('niche').value = tag.textContent; performSearch();
    }));
    document.getElementById('searchBtn').addEventListener('click', performSearch);
    document.getElementById('clearBtn').addEventListener('click', clearFilters);
    document.getElementById('niche').addEventListener('keydown', event => { if (event.key === 'Enter') performSearch(); });

    function clearFilters() {
        document.getElementById('niche').value = '';
        document.getElementById('language').value = 'pt-BR';
        document.getElementById('period').value = 'month';
        document.getElementById('resultsArea').innerHTML = '<div class="empty-state"><div style="font-size:4rem">🎬</div><p>Digite um nicho e clique em "Buscar vídeos virais" para começar.</p></div>';
    }
    function performSearch() {
        const niche = document.getElementById('niche').value.trim();
        if (!niche) { alert('Digite um nicho ou categoria antes de buscar.'); return; }
        document.getElementById('resultsArea').innerHTML = '<div class="loading">Buscando vídeos...</div>';
        setTimeout(() => renderResults(niche), 300);
    }
    function renderResults(niche) {
        let videos = [];
        if (selectedPlatforms.has('instagram')) videos = videos.concat(demoVideos.instagram.map(video => ({ ...video, platform: 'instagram' })));
        if (selectedPlatforms.has('youtube')) videos = videos.concat(demoVideos.youtube.map(video => ({ ...video, platform: 'youtube' })));
        const platforms = [...selectedPlatforms].map(platform => platform === 'instagram' ? 'Instagram' : 'YouTube').join(', ');
        let html = `<div style="color:white; margin:18px 0 12px; font-weight:600">Resultados para: "${escapeHtml(niche)}" | Plataformas: ${platforms}</div><div class="results-container">`;
        videos.forEach(video => {
            const safeUrl = getSafeVideoUrl(video.videoUrl);
            html += `<article class="video-card"><div class="video-thumbnail">${video.platform === 'instagram' ? '📷' : '▶️'}<span class="platform-badge ${video.platform}">${video.platform === 'instagram' ? 'Instagram' : 'YouTube'}</span></div><div class="video-info"><div class="video-title">${escapeHtml(video.title)}</div><div class="video-stats"><div class="stat"><span class="stat-label">Visualizações</span><span class="stat-value">${formatNumber(video.views)}</span></div><div class="stat"><span class="stat-label">Curtidas</span><span class="stat-value">${formatNumber(video.likes)}</span></div></div><div class="meta">📁 ${video.format} • ⏱️ ${video.duration}</div><div class="video-actions"><button class="action-btn" type="button" data-copy="${escapeHtml(video.title)}">📋 Copiar</button><a class="action-btn" href="${escapeHtml(safeUrl)}" target="_blank" rel="noopener noreferrer">🔗 Abrir vídeo</a></div></div></article>`;
        });
        html += '</div>';
        document.getElementById('resultsArea').innerHTML = html;
        document.querySelectorAll('[data-copy]').forEach(button => button.addEventListener('click', () => copyToClipboard(button.dataset.copy)));
    }
    function getSafeVideoUrl(value) {
        try {
            const url = new URL(value);
            return ['www.youtube.com', 'youtube.com', 'www.instagram.com', 'instagram.com'].includes(url.hostname) && url.protocol === 'https:' ? url.href : '#';
        } catch { return '#'; }
    }
    function formatNumber(value) { return value >= 1000000 ? (value / 1000000).toFixed(1) + 'M' : value >= 1000 ? (value / 1000).toFixed(0) + 'K' : String(value); }
    function escapeHtml(text) { return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;'); }
    function copyToClipboard(text) {
        if (!navigator.clipboard) { alert('Não foi possível copiar automaticamente.'); return; }
        navigator.clipboard.writeText(text).then(() => alert('✅ Título copiado para a área de transferência!')).catch(() => alert('Não foi possível copiar automaticamente.'));
    }
    clearFilters();
</script>
</body>
</html>
